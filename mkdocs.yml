site_name: FAIR² Specification
site_url: https://fair2.ai/spec/
theme:
  name: material
  logo: assets/images/fair2-logo.png
extra:
  favicon: assets/images/favicon.ico
  version:
    provider: mike
    default: latest
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/css/overrides.css
nav:
  - Home: index.md
  - Specification:
      - Overview: specification/overview.md
      - fair2.json File Format: specification/fair2json-format.md
      - Versioning & Conformance: specification/versioning.md
      - Schema: specification/schema.md
      - SHACL Validation: specification/shacl-validation.md
      - FAIR² Ontology: specification/fair2-ontology.md
      - Namespace Prefixes: specification/prefixes.md
      - Methods: specification/methods.md
      - FAIR² Data Dictionary: specification/data-dictionary.md
      - Governance Model: specification/governance-model.md
      - Governance Blocks: specification/governance.md
      - Certification: specification/certification.md
      - Responsible AI: specification/responsible-ai.md
      - Provenance and Citations: specification/provenance.md
  - Integration:
      - ML Croissant: integration/ml-croissant.md
      - Schema.org: integration/schema-org.md
      - PROV-O: integration/prov-o.md
      - Units: integration/units-qudt-om.md
      - Contributor Roles: integration/contributor-roles.md
      - Croissant RAI: integration/croissant-rai.md
      - Google Rich Search: integration/google-rich-search.md
      - ODPS Integration: integration/odps.md
      - ODRL Policies: integration/odrl-policy.md
  - Examples: examples/example-walkthrough.md
  - Community:
      - Contributing: community/contributing.md
      - Governance: community/governance.md
      - Roadmap: community/roadmap.md
